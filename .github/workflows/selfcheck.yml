name: selfcheck

# 公开仓里能做到的 CI：
#
#   ✅ 能跑：三个产品智能体的 demo、示例脚本、技能包构建与结构自检
#   ✅ 能跑：验证智能体被基座**发现**（entry point 接线正确性）
#   ❌ 不能跑：验证智能体真正跑一遍
#              —— 它们要读 PASM 核心仓（私有）与 PASM-Lite/Studio 仓，
#                 公开 runner 上既没有这些仓库，也不该把私有源码拉进来。
#
# 所以这个工作流的价值是：**保证接线没坏** ——
# 基座依赖装得上、包导得进、demo 跑得通、技能包结构没放错、
# 验证智能体能被 `pasm_skills` 发现。完整的长期验证仍在本地或自托管跑（见 README）。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 装基座（PyPI 尚未发布，从公开仓装）
        run: pip install "pasm-skills @ git+https://github.com/arronJack/pasm-skills.git"

      - name: 装本仓
        run: pip install -e .

      - name: 基座自检
        run: python -m pasm_skills selftest

      - name: 三个产品智能体的 demo
        run: |
          python -m pasm_agents demo npc
          python -m pasm_agents demo companion
          python -m pasm_agents demo tutor

      - name: 示例脚本
        run: |
          python examples/npc_quickstart.py
          python examples/companion_quickstart.py
          python examples/tutor_quickstart.py

      - name: 验证智能体能否被基座发现（entry point 接线）
        run: |
          python -m pasm_skills list
          python -m pasm_skills agents
          # 7 个都必须出现，否则 entry point 配错了
          for n in core-verifier parity-guard regression npc-lifelong companion-elderly study-tutor soak-longrun; do
            python -m pasm_skills list | grep -q "$n" || { echo "缺少 $n"; exit 1; }
          done

      - name: 技能包构建 + 结构自检
        run: python tools/build_skill.py --zip --clean
