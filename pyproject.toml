[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pasm-agents"
version = "0.4.10"
description = "PASM 智能体集 —— 基于 PASM 引擎的成品智能体：游戏 NPC / 老人陪伴 / 学习陪伴 + 七个长期验证智能体"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "arronzheng" }]
keywords = [
    "pasm", "agent", "npc", "companion", "elderly-care", "tutor",
    "memory", "emotion", "verification", "long-run",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# 依赖基座（SDK / 验证器框架 / 打包库）+ 应用开发框架（独立成仓）
dependencies = ["pasm-skills>=0.5.1", "pasm-framework>=0.1.0"]

[project.optional-dependencies]
# 想要完整档位（真情绪模块）时指向带 torch 的解释器；
# 或写本机配置（仓库外）~/.pasm-skills/local.json
torch = ["torch"]

[project.urls]
Homepage = "https://gitee.com/arronzheng/pasm-agents"
Repository = "https://github.com/arronJack/pasm-agents"
Source = "https://gitee.com/arronzheng/pasm-agents"
Issues = "https://gitee.com/arronzheng/pasm-agents/issues"

[project.scripts]
pasm-agents = "pasm_agents.cli:main"

# ★ 关键：声明给基座发现。装上本包后，`python -m pasm_skills list`
#   就能看到下面这些验证智能体（不需要改基座一行代码）。
[project.entry-points."pasm_skills.agents"]
pasm-verifiers = "pasm_agents.verifiers"

# ★ 智能体实现在 `agents/`（每个智能体一个文件夹，便于逐个学习/取用），
#   `pasm_agents/` 是聚合转发层（公开 API 的稳定入口）。
#   两者都必须进 wheel —— 少一个 `from pasm_agents import NpcAgent` 就会断。
[tool.setuptools.packages.find]
include = ["pasm_agents*", "agents*"]

[tool.setuptools.package-data]
pasm_agents = ["py.typed"]
